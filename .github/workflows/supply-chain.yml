name: Supply Chain Security

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'supply-chain/**'
      - 'deny.toml'
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'supply-chain/**'
      - 'deny.toml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  cargo-vet:
    name: Cargo Vet
    runs-on: [self-hosted, linux, x64, light]
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable && rustup default stable
    - name: Install cargo-vet
      run: cargo install --locked cargo-vet
    - name: Run cargo vet
      run: cargo vet
      continue-on-error: true

  cargo-audit:
    name: Cargo Audit
    # Stays on ubuntu-latest: smithy-shipped cargo-audit's bundled rustsec parser rejects RUSTSEC-2026-0037 ("unsupported CVSS version: 4.0"). Move back once smithy bumps cargo-audit to 0.22.1+.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable && rustup default stable
    - name: Install cargo-audit
      run: cargo install --locked cargo-audit
    - name: Run cargo audit
      # Ignore list stays in sync with deny.toml [advisories].ignore.
      # RUSTSEC-2026-0097 (rand 0.8.5 transitive) was removed from this
      # list when regorus was bumped 0.2.8 → 0.10 — the residual 0.8.5
      # instance now drops out of the dep graph entirely.
      run: |
        cargo audit \
          --ignore RUSTSEC-2025-0046 \
          --ignore RUSTSEC-2025-0118 \
          --ignore RUSTSEC-2026-0006 \
          --ignore RUSTSEC-2026-0020 \
          --ignore RUSTSEC-2026-0021 \
          --ignore RUSTSEC-2025-0057 \
          --ignore RUSTSEC-2025-0134 \
          --ignore RUSTSEC-2024-0436

  cargo-deny:
    name: Cargo Deny
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    # EmbarkStudios/cargo-deny-action@v2 runs in a musl container that can't
    # install the toolchain pinned by rust-toolchain.toml (issue #103). Also
    # fails on smithy (rootless container + NoNewPrivileges). Install +
    # invoke cargo-deny directly so the runner's rustup respects the project
    # toolchain file. bans/licenses/sources only — advisories live in the
    # cargo-audit job above.
    - name: Install cargo-deny
      run: cargo install --locked cargo-deny --version 0.16.4
    - name: Run cargo deny check
      run: cargo deny check bans licenses sources

  mutants:
    name: Mutation Testing
    runs-on: [self-hosted, linux, x64, lean-mem]
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@nightly
    - uses: Swatinem/rust-cache@v2
    - name: Install cargo-mutants
      uses: taiki-e/install-action@v2.87.6
      with:
        tool: cargo-mutants
    - name: Run mutation testing on security-critical modules
      run: |
        cargo mutants -p wsc --timeout 120 --jobs 4 --output mutants-wsc \
          -f src/lib/src/signature/ \
          -f src/lib/src/dsse.rs \
          -f src/lib/src/format/ \
          -E "proofs::" \
          -E "key_id" \
          -- --lib
    # The classic verification core lives in `wsc-verify-core` after the
    # carve. Running cargo-mutants on it too keeps the zero-survivor gate
    # on the moved signature code — without this step the original `-f
    # src/lib/src/signature/` filter would silently match almost nothing
    # post-merge and the gate would pass for the wrong reason.
    - name: Run mutation testing on wsc-verify-core (carved verification core)
      run: |
        cargo mutants -p wsc-verify-core --timeout 120 --jobs 4 \
          --output mutants-verify-core \
          -f src/verify-core/src/signature/ \
          -E "proofs::" \
          -- --lib
    - name: Check surviving mutants
      run: |
        missed_count() {
          if [ -f "$1/missed.txt" ]; then
            wc -l < "$1/missed.txt" | tr -d ' '
          else
            echo 0
          fi
        }
        WSC=$(missed_count mutants-wsc)
        CORE=$(missed_count mutants-verify-core)
        TOTAL=$((WSC + CORE))
        echo "Surviving mutants: wsc=$WSC, wsc-verify-core=$CORE, total=$TOTAL"
        if [ "$TOTAL" -gt 0 ]; then
          echo "::error::$TOTAL mutant(s) survived — tests must catch all mutations in security-critical code"
          for d in mutants-wsc mutants-verify-core; do
            if [ -f "$d/missed.txt" ]; then
              echo "--- $d/missed.txt ---"
              head -15 "$d/missed.txt"
            fi
          done
          exit 1
        fi
        echo "All mutants killed!"
    - name: Upload mutants reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: mutants-reports
        path: |
          mutants-wsc/
          mutants-verify-core/
